<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer dashboard — AgriConnect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="dash-body">

<nav class="nav nav-dash" id="dashNav"></nav>

<div class="dash-layout">
  <aside class="dash-sidebar">
    <button class="dash-nav-item active" data-view="browse">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke-width="1.6"/><path d="m20 20-3.5-3.5" stroke-width="1.6"/></svg>
      Browse
    </button>
    <button class="dash-nav-item" data-view="orders">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 9h16l-1.5 10.5a1 1 0 0 1-1 .9H6.5a1 1 0 0 1-1-.9L4 9Z" stroke-width="1.6"/><path d="M8 9V6a4 4 0 0 1 8 0v3" stroke-width="1.6"/></svg>
      My orders
    </button>
  </aside>

  <main class="dash-main">

    <!-- BROWSE -->
    <section class="dash-view active" id="view-browse">
      <div class="dash-header">
        <h1>Browse the marketplace</h1>
        <p class="muted">Produce listed directly by farmers.</p>
      </div>
      <div class="flex-gap" style="margin-bottom:22px;">
        <input type="text" id="searchInput" placeholder="Search products…" style="max-width:280px;">
        <select id="categorySelect" style="max-width:200px;">
          <option value="">All categories</option>
          <option value="vegetables">Vegetables</option>
          <option value="fruits">Fruits</option>
          <option value="grains">Grains</option>
          <option value="dairy">Dairy</option>
          <option value="pulses">Pulses</option>
          <option value="spices">Spices</option>
          <option value="flowers">Flowers</option>
          <option value="poultry">Poultry</option>
        </select>
        <button class="btn btn-ghost btn-sm" onclick="loadBrowse()">Filter</button>
      </div>
      <div id="browseGrid" class="product-grid"></div>
      <div id="browseEmpty" class="empty-state" style="display:none;"><p>No products match your search.</p></div>
    </section>

    <!-- ORDERS -->
    <section class="dash-view" id="view-orders">
      <div class="dash-header"><h1>My orders</h1><p class="muted">Track every order from confirmation to delivery.</p></div>
      <div id="ordersList"></div>
      <div id="ordersEmpty" class="empty-state" style="display:none;"><p>You haven't placed any orders yet.</p></div>
    </section>

  </main>
</div>

<!-- Cart FAB -->
<button class="cart-fab" id="cartFab" onclick="openCart()">
  🛒 Cart <span class="cart-count" id="cartCount">0</span>
</button>

<!-- Cart modal -->
<div class="modal-backdrop" id="cartModal">
  <div class="modal">
    <div class="modal-header">
      <h3 style="margin:0;">Your cart</h3>
      <button class="modal-close" onclick="closeCart()">×</button>
    </div>
    <div id="cartLines"></div>
    <div id="cartEmptyMsg" class="empty-state" style="display:none;padding:24px 0;"><p>Your cart is empty.</p></div>
    <div class="cart-total-row"><span>Total</span><span class="mono" id="cartTotal">₹0.00</span></div>
    <div class="field" style="margin-top:18px;">
      <label for="deliveryAddress">Delivery address</label>
      <input type="text" id="deliveryAddress" placeholder="Where should this be delivered?">
    </div>
    <button class="btn btn-primary btn-block" id="checkoutBtn" onclick="checkout()">Place order</button>
  </div>
</div>

<script src="js/common.js"></script>
<script>
  if (!requireRole('CUSTOMER')) { /* redirected */ }
  renderDashNav('Customer');

  const navItems = document.querySelectorAll('.dash-nav-item');
  navItems.forEach(item => item.addEventListener('click', () => switchView(item.dataset.view)));

  function switchView(view) {
    document.querySelectorAll('.dash-view').forEach(v => v.classList.remove('active'));
    document.getElementById('view-' + view).classList.add('active');
    navItems.forEach(n => n.classList.toggle('active', n.dataset.view === view));
    if (view === 'browse') loadBrowse();
    if (view === 'orders') loadOrders();
  }

  // ---------- Cart (in-memory for this session) ----------
  let cart = {}; // productId -> {product, qty}

  function updateCartUI() {
    const count = Object.values(cart).reduce((s, c) => s + c.qty, 0);
    document.getElementById('cartCount').textContent = count;
  }

  function addToCart(product) {
    if (!cart[product.id]) cart[product.id] = { product, qty: 0 };
    if (cart[product.id].qty >= product.quantity) { toast('No more stock available', 'error'); return; }
    cart[product.id].qty += 1;
    updateCartUI();
    toast(`Added ${product.name} to cart`, 'success');
  }

  function openCart() {
    const wrap = document.getElementById('cartLines');
    const empty = document.getElementById('cartEmptyMsg');
    const items = Object.values(cart);
    wrap.innerHTML = '';
    let total = 0;
    if (!items.length) {
      empty.style.display = 'block';
    } else {
      empty.style.display = 'none';
      items.forEach(({ product, qty }) => {
        total += product.price * qty;
        const line = document.createElement('div');
        line.className = 'cart-line';
        line.innerHTML = `
          <div><strong>${escapeHtml(product.name)}</strong><div class="muted mono" style="font-size:0.78rem;">${money(product.price)} / ${escapeHtml(product.unit||'unit')}</div></div>
          <div class="qty-controls">
            <button class="qty-btn" onclick="changeQty(${product.id}, -1)">−</button>
            <span class="mono">${qty}</span>
            <button class="qty-btn" onclick="changeQty(${product.id}, 1)">+</button>
          </div>`;
        wrap.appendChild(line);
      });
    }
    document.getElementById('cartTotal').textContent = money(total);
    document.getElementById('cartModal').classList.add('show');
  }

  function changeQty(productId, delta) {
    const entry = cart[productId];
    if (!entry) return;
    entry.qty += delta;
    if (entry.qty <= 0 || entry.qty > entry.product.quantity) {
      if (entry.qty > entry.product.quantity) toast('No more stock available', 'error');
      if (entry.qty <= 0) delete cart[productId];
    }
    updateCartUI();
    openCart();
  }

  function closeCart() { document.getElementById('cartModal').classList.remove('show'); }

  async function checkout() {
    const items = Object.values(cart);
    if (!items.length) { toast('Your cart is empty', 'error'); return; }
    const address = document.getElementById('deliveryAddress').value.trim();
    if (!address) { toast('Enter a delivery address', 'error'); return; }

    const btn = document.getElementById('checkoutBtn');
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
    try {
      await authFetch('/api/customer/orders', {
        method: 'POST',
        body: JSON.stringify({
          items: items.map(i => ({ productId: i.product.id, quantity: i.qty })),
          deliveryAddress: address
        })
      });
      cart = {};
      updateCartUI();
      closeCart();
      toast('Order placed!', 'success');
      switchView('orders');
    } catch (err) { toast(err.message, 'error'); }
    finally { btn.disabled = false; btn.textContent = 'Place order'; }
  }

  // ---------- Browse ----------
  async function loadBrowse() {
    try {
      const keyword = document.getElementById('searchInput').value.trim();
      const category = document.getElementById('categorySelect').value;
      const params = new URLSearchParams();
      if (keyword) params.set('keyword', keyword);
      if (category) params.set('category', category);
      const products = await authFetch('/api/customer/products' + (params.toString() ? '?' + params.toString() : ''));
      const grid = document.getElementById('browseGrid');
      const empty = document.getElementById('browseEmpty');
      grid.innerHTML = '';
      if (!products.length) { empty.style.display = 'block'; return; }
      empty.style.display = 'none';
      products.forEach(p => grid.appendChild(browseCard(p)));
    } catch (err) { toast(err.message, 'error'); }
  }

  function browseCard(p) {
    const el = document.createElement('div');
    el.className = 'product-card';
    el.innerHTML = `
      <div class="product-card-top">
        <h4>${escapeHtml(p.name)}</h4>
        <span class="price">${money(p.price)}</span>
      </div>
      <div class="meta-row">
        <span class="badge badge-canopy">${escapeHtml(p.category || 'other')}</span>
        <span>${p.quantity} ${escapeHtml(p.unit || '')} left</span>
      </div>
      <p class="desc">${escapeHtml((p.description || '').slice(0, 110))}${(p.description||'').length > 110 ? '…' : ''}</p>
      <div class="meta-row"><span class="muted">By ${escapeHtml(p.farmer ? p.farmer.name : 'a local farmer')}</span></div>
      <button class="btn btn-primary btn-sm btn-block" onclick='addToCart(${JSON.stringify(p).replace(/'/g, "&apos;")})'>Add to cart</button>
    `;
    return el;
  }

  document.getElementById('searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') loadBrowse(); });

  // ---------- Orders + tracking ----------
  async function loadOrders() {
    try {
      const orders = await authFetch('/api/customer/orders');
      const wrap = document.getElementById('ordersList');
      const empty = document.getElementById('ordersEmpty');
      wrap.innerHTML = '';
      if (!orders.length) { empty.style.display = 'block'; return; }
      empty.style.display = 'none';
      orders.sort((a, b) => b.id - a.id).forEach(o => wrap.appendChild(orderCard(o)));
    } catch (err) { toast(err.message, 'error'); }
  }

  function orderCard(o) {
    const el = document.createElement('div');
    el.className = 'panel';
    const itemsList = (o.items || []).map(i => `${i.quantity} × ${escapeHtml(i.product ? i.product.name : 'item')}`).join(', ');
    el.innerHTML = `
      <div class="panel-header">
        <div>
          <h3>Order #${o.id}</h3>
          <div class="muted" style="font-size:0.82rem;">${timeAgo(o.orderDate)} · ${escapeHtml(itemsList)}</div>
        </div>
        <div style="text-align:right;">
          <div class="mono" style="font-weight:600;">${money(o.totalAmount)}</div>
          <span class="badge ${statusBadgeClass(o.status)}">${o.status.replace(/_/g,' ')}</span>
        </div>
      </div>
      <div class="timeline" id="tl-${o.id}"></div>
      <button class="btn btn-ghost btn-sm" onclick="trackOrder(${o.id})">Refresh tracking</button>
    `;
    setTimeout(() => trackOrder(o.id), 50);
    return el;
  }

  const DELIVERY_STEPS = ['UNASSIGNED', 'ASSIGNED', 'PICKED_UP', 'IN_TRANSIT', 'DELIVERED'];
  const DELIVERY_LABELS = { UNASSIGNED: 'Placed', ASSIGNED: 'Assigned', PICKED_UP: 'Picked up', IN_TRANSIT: 'In transit', DELIVERED: 'Delivered' };

  async function trackOrder(orderId) {
    try {
      const delivery = await authFetch(`/api/delivery/order/${orderId}/track`);
      const el = document.getElementById('tl-' + orderId);
      if (!el) return;
      const currentIdx = DELIVERY_STEPS.indexOf(delivery.status);
      el.innerHTML = DELIVERY_STEPS.map((step, i) => {
        const cls = i < currentIdx ? 'done' : i === currentIdx ? 'current' : '';
        return `<div class="timeline-step ${cls}"><div class="dot"></div><div class="tl-label">${DELIVERY_LABELS[step]}</div></div>`;
      }).join('');
      const nextEl = el.nextElementSibling;
      if (nextEl && nextEl.classList.contains('tl-location')) nextEl.remove();
      if (delivery.currentLocation) {
        el.insertAdjacentHTML('afterend', `<div class="muted tl-location" style="font-size:0.8rem;margin-bottom:10px;">📍 ${escapeHtml(delivery.currentLocation)}</div>`);
      }
    } catch (err) { /* delivery record may not exist yet — ignore */ }
  }

  loadBrowse();
</script>
</body>
</html>
